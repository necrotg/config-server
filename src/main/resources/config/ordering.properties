# Server
server.port=8080
spring.application.name=ordering

# Health
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true
management.endpoints.health.probes.enabled=true
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true
management.metrics.tags.application=${spring.application.name}
# Eureka
eureka.instance.hostname=ordering
eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://eureka-server:8070/eureka/

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retry.backoff.ms=500
spring.kafka.producer.properties.retry.backoff.max.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map

# App Properties
ordering.notification-topic=notification-events
ordering.notification-status-topic=notification-status-events
ordering.notification-dispatcher.poll-interval-ms=1000
ordering.notification-dispatcher.lease-ms=30000
ordering.notification-dispatcher.initial-backoff-ms=1000
ordering.notification-dispatcher.max-backoff-ms=60000

info.app=ordering
info.app.description=Main application for ordering
